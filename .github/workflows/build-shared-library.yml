name: build shared library

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: init cmake
        run: cmake -S .

      - name: build shared library
        run: make

      - name: run main
        run: ./build/main-psar

      - name: run gtest
        run: timeout 20s ./build/test-psar --output-on-failure
